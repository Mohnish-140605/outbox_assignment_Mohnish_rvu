services:
  - type: web
    name: reachinbox-api
    runtime: node
    rootDir: backend
    region: oregon
    plan: 0.5c-512mb
    buildCommand: npm ci && npx prisma generate && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /health
    maxShutdownDelaySeconds: 120
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: reachinbox-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: reachinbox-redis
          property: connectionString
      - key: EMAIL_WORKER_CONCURRENCY
        value: 5
      - key: FRONTEND_ORIGIN
        value: https://reachinbox-frontend.onrender.com
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: SLACK_CLIENT_ID
        sync: false
      - key: SLACK_CLIENT_SECRET
        sync: false
      - key: SLACK_CALLBACK_URL
        sync: false
      - key: ETHEREAL_HOST
        value: smtp.ethereal.email
      - key: ETHEREAL_PORT
        value: 587
      - key: ETHEREAL_USER
        sync: false
      - key: ETHEREAL_PASSWORD
        sync: false
      - key: ELASTICSEARCH_URL
        sync: false
      - key: ELASTICSEARCH_API_KEY
        sync: false

  - type: web
    runtime: static
    name: reachinbox-frontend
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: VITE_API_URL
        fromService:
          type: web
          name: reachinbox-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_BACKEND_ORIGIN
        fromService:
          type: web
          name: reachinbox-api
          envVarKey: RENDER_EXTERNAL_URL

  - type: keyvalue
    name: reachinbox-redis
    region: oregon
    plan: 256mb
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot

databases:
  - name: reachinbox-postgres
    region: oregon
    plan: 0.5c-1g
    databaseName: reachinbox
    ipAllowList: []
